name: update-data

# The collector, so no computer has to stay on (scripts/actions_collector.py): one run reads the electricity meter every
# 10 min and every 30 min pulls ThingsBoard telemetry, rebuilds the 10-min table and publishes it to the orphan branch
# `data` (single commit, force-pushed -> the repository does not grow) and to the SIS PFAL SQL database. After ~5.5 h
# it starts the next run itself, because GitHub runs schedules late or skips them at busy times; the schedule below only
# restarts the chain if it ever breaks (a run that finds another one going waits in the queue, one at a time).
# The Tuya token is kept between runs in the Actions cache, encrypted with the TUYA_BOX_KEY secret (the repository is
# public); a fresh login (scripts/tuya_login.py --github) arrives as the TUYA_TOKEN_SEED secret.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "how long this run collects (max ~340)"
        default: "330"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore the current store from the data branch
        run: |
          git fetch origin data --depth=1 || exit 0
          git checkout origin/data -- data/raw/iot/thingsboard_long.parquet data/processed/iot_10min.parquet data/processed/store_manifest.json || true
          git reset -q

      - name: Restore the Tuya token
        uses: actions/cache/restore@v4
        with:
          path: .tuya_box
          key: tuya-token-${{ github.run_id }}
          restore-keys: tuya-token-

      - name: Open the Tuya token
        continue-on-error: true
        env:
          TUYA_BOX_KEY: ${{ secrets.TUYA_BOX_KEY }}
          TUYA_TOKEN_SEED: ${{ secrets.TUYA_TOKEN_SEED }}
        run: python scripts/token_box.py open

      - name: Collect (meter every 10 min, store every 30 min)
        env:
          TUYA_BOX_KEY: ${{ secrets.TUYA_BOX_KEY }}
          TUYA_USER_CODE: ${{ secrets.TUYA_USER_CODE }}
          TUYA_DEVICE_ID: ${{ secrets.TUYA_DEVICE_ID }}
          PFAL_DB_USER: ${{ secrets.PFAL_DB_USER }}
          PFAL_DB_PASS: ${{ secrets.PFAL_DB_PASS }}
          PUSH_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: python scripts/actions_collector.py ${{ inputs.minutes || '330' }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('.tuya_box/token.enc') != ''
        with:
          path: .tuya_box
          key: tuya-token-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start the next run
        if: always() && (inputs.minutes || '330') == '330'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update_data.yml --ref ${{ github.ref_name }}
